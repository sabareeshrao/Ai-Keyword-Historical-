name: Import 10,000 AI keyword inventory terms

on:
  push:
    paths:
      - ".github/workflows/import_inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data parser
        run: python -m pip install --quiet pyarrow
      - name: Import and validate 10,000 keywords
        run: python scripts/populate_inventory_10000.py
      - name: Commit sourced inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/KEYWORD_INVENTORY.csv data/INVENTORY_IMPORT_REPORT.json batches/INVENTORY_001_5000.md batches/INVENTORY_002_5000.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Inventory batches 001-002: add 10,000 sourced AI-related terms"
          git push origin HEAD:main
