name: Research documented dates for next 1000 keywords

on:
  push:
    paths:
      - ".github/workflows/research_dates_002.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find source-dated scholarly attestations for AIH-00501 through AIH-01500
        run: python scripts/research_dates_next_1000.py
      - name: Update all full keyword tables with linked dates
        run: python scripts/build_keyword_tables.py
      - name: Update progress README
        run: python scripts/sync_readme.py
      - name: Commit evidence only after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_002_REPORT.json batches/DATE_RESEARCH_002_NEXT_1000.md batches/date-research-002/ tables/ README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Date evidence for next 1000 AI keywords, with two full linked tables"
          git push origin HEAD:main
