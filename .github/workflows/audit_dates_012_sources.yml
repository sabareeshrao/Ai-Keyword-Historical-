name: Audit Batch 012 historical dates and domain matches

on:
  push:
    paths:
      - ".github/workflows/audit_dates_012_sources.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-keyword-dates-012
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply six early original technical sources and withdraw five unrelated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit_dates_012_original_sources.py
            python scripts/build_keyword_tables.py
            python scripts/sync_readme.py
            python - <<'PY'
          import csv,json
          from pathlib import Path
          report=json.loads(Path("data/DATE_RESEARCH_012_REPORT.json").read_text(encoding="utf-8"))
          assert report["examined"]==2000 and report["inventory_total"]==20100
          assert report["manual_technical_source_checks"]==6
          assert report["cross_domain_sources_withdrawn"]==5
          assert sum(report[x] for x in ("documented_source_dates","estimated_star_dates","unresolved"))==2000
          with Path("data/KEYWORD_INVENTORY.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20100 and len({r["id"] for r in rows})==20100
          byid={r["id"]:r for r in rows}
          expected={"AIH-16512":"1991","AIH-17002":"1980","AIH-17015":"1997",
                    "AIH-18001":"1990","AIH-18003":"1992","AIH-18013":"1965"}
          for uid,year in expected.items():
              r=byid[uid]
              assert r["historical_evidence_date"]==year
              assert r["historical_evidence_url"].startswith("https://")
              assert r["date_status"]=="documented_source_not_first_use"
              assert not r.get("first_use_date")
          for uid in ("AIH-17505","AIH-17509","AIH-17510","AIH-17516","AIH-18014"):
              r=byid[uid]
              assert not r.get("historical_evidence_date")
              assert r["date_status"]=="unresolved"
          for page in range(1,5):
              text=Path(f"batches/date-research-012/page-{page:02d}.md").read_text()
              assert sum(x.startswith("| AIH-") for x in text.splitlines())==500
          assert Path("batches/UNDATED_RECOVERY_DOUBLE_STAR.md").exists()
          assert Path("data/UNDATED_RECOVERY_DOUBLE_STAR_REPORT.json").exists()
          assert byid["AIH-02503"]["historical_evidence_date"]=="2016"
          assert byid["AIH-06007"]["historical_evidence_date"]=="2023"
          print("Batch 012 audited; 2000 records, six source corrections, five withdrawals.")
          PY
            git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_012_REPORT.json batches/DATE_RESEARCH_012_NEXT_2000.md batches/date-research-012/ tables/
            if git diff --cached --quiet; then
              echo "No change needed"
              exit 0
            fi
            git commit -m "Audit Batch 012: six early sources and five cross-domain date withdrawals"
            if git push origin HEAD:main; then
              echo "Audited Batch 012 published"
              exit 0
            fi
            sleep 3
          done
          exit 1
