name: Second-source historical date check for first 500

on:
  push:
    paths:
      - ".github/workflows/openalex_date_fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check un-dated terms against OpenAlex scholarly works
        run: python scripts/research_dates_openalex_fallback.py
      - name: Update linked complete keyword tables
        run: python scripts/build_keyword_tables.py
      - name: Synchronize README
        run: python scripts/sync_readme.py
      - name: Commit checked research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_001_REPORT.json batches/DATE_RESEARCH_001_FIRST_500.md tables/ README.md
          git diff --cached --quiet && exit 0
          git commit -m "Expand first 500 date evidence with second scholarly-index cross-check"
          git push origin HEAD:main
