name: Audit Batch 011 original technical sources

on:
  push:
    paths:
      - ".github/workflows/audit_dates_011_sources.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-source-011
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Correct four source dates and preserve earlier research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit_dates_011_primary_sources.py
            python scripts/build_keyword_tables.py
            python scripts/sync_readme.py
            python - <<'PY'
          import csv,json
          from pathlib import Path
          info=json.loads(Path("data/DATE_RESEARCH_011_REPORT.json").read_text())
          assert info["examined"]==2000 and info["inventory_total"]==20100
          assert info["manual_original_source_checks"]==4
          assert sum(info[k] for k in ("documented_source_dates","estimated_star_dates","unresolved"))==2000
          with Path("data/KEYWORD_INVENTORY.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20100 and len({x["id"] for x in rows})==20100
          by_id={x["id"]:x for x in rows}
          expected={"AIH-14501":"1979","AIH-15481":"1975",
                    "AIH-15691":"1989","AIH-16010":"2013"}
          for uid,year in expected.items():
              r=by_id[uid]
              assert r["historical_evidence_date"]==year
              assert r["historical_evidence_url"].startswith("https://")
              assert not r["first_use_date"]
          for i in range(1,5):
              page=Path(f"batches/date-research-011/page-{i:02d}.md")
              assert sum(s.startswith("| AIH-") for s in page.read_text().splitlines())==500
          for n in range(5,10):
              assert Path(f"batches/DATE_RESEARCH_{n:03d}_NEXT_2000.md").exists()
          assert Path("batches/DATE_RESEARCH_010_NEXT_2000.md").exists()
          assert Path("batches/UNDATED_RECOVERY_DOUBLE_STAR.md").exists()
          assert any("★★" in r.get("display_date","") for r in rows if int(r["id"].split("-")[-1])<=12500)
          assert Path("batches/DATE_RESEARCH_004_RECOVERY_FIRST_1000.md").exists()
          assert by_id["AIH-02503"]["historical_evidence_date"]=="2016"
          assert by_id["AIH-06007"]["historical_evidence_date"]=="2023"
          print("QA passed: primary sources, 2000 dates, four pages and all stable IDs.")
          PY
            git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_011_REPORT.json batches/DATE_RESEARCH_011_NEXT_2000.md batches/date-research-011/ tables/
            if git diff --cached --quiet; then
              echo "Already current"
              exit 0
            fi
            git commit -m "Audit Batch 011: verify MVC, Mamdani, BGP and Ethereum from original documentation"
            if git push origin HEAD:main; then
              echo "Audited Batch 011 published"
              exit 0
            fi
            sleep 3
          done
          exit 1
