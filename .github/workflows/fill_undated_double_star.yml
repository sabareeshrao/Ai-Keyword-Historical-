name: Fill all previously undated terms with double-star guessed years

on:
  push:
    paths:
      - ".github/workflows/fill_undated_double_star.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: undated-double-star-recovery
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fill all originally researched but undated IDs using ★★ guesses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp data/KEYWORD_INVENTORY.csv /tmp/pre-recovery-master.csv
            python scripts/fill_undated_double_star.py
            python scripts/build_keyword_tables.py
            python scripts/sync_readme.py
            python - <<'PY'
          import csv,json
          from pathlib import Path
          with open('/tmp/pre-recovery-master.csv',newline='',encoding='utf-8') as f:
              old=list(csv.DictReader(f))
          with open('data/KEYWORD_INVENTORY.csv',newline='',encoding='utf-8') as f:
              new=list(csv.DictReader(f))
          assert len(old)==len(new)==20100
          assert [r['id'] for r in old]==[r['id'] for r in new]
          targets=[r for r in old if int(r['id'].split('-')[-1])<=12500 and not any(
             r.get(k) for k in ('first_use_date','historical_evidence_date','estimated_first_use_year','guessed_first_use_year')
          )]
          results=json.loads(Path('data/UNDATED_RECOVERY_DOUBLE_STAR_REPORT.json').read_text())
          assert results['previously_missing_in_scope']==len(targets)
          assert results['guessed_double_star_added']==len(targets)
          assert results['left_without_any_date_in_scope']==0
          assert results['previous_dates_overwritten']==0
          assert results['confidence']=='very_low'
          assert results['verified_term_origin_added']==0
          oldcols=set(old[0].keys())
          selected={r['id'] for r in targets}
          for before,after in zip(old,new):
              assert all(after.get(k,'')==before.get(k,'') for k in oldcols if before['id'] not in selected or k not in ('date_status','display_date')), 'Original evidence column overwritten: '+before['id']
              if before['id'] in selected:
                  assert after['date_status']=='guessed_double_star'
                  assert after['display_date']==after['guessed_first_use_year']+' ★★'
                  assert after['guess_reason'] and after['guess_year_range'] and after['guess_confidence']=='very_low'
              elif int(before['id'].split('-')[-1])>12500:
                  assert not after.get('guessed_first_use_year')
          pages=sorted(Path('batches/undated-recovery-double-star').glob('page-*.md'))
          assert len(pages)==(len(targets)+499)//500
          count=sum(sum(line.startswith('| AIH-') for line in p.read_text().splitlines()) for p in pages)
          assert count==len(targets)
          assert len(pages)==0 or all(sum(line.startswith('| AIH-') for line in p.read_text().splitlines())==500 for p in pages[:-1])
          assert 'UNDATED_RECOVERY_DOUBLE_STAR.md' in Path('README.md').read_text()
          assert sum(p.read_text().count('★★') for p in Path('tables').glob('batch-*/page-*.md'))>=len(targets)
          print('PASS: '+str(len(targets))+' low-confidence ★★ guesses, preserved all earlier dates and IDs.')
          PY
            git add README.md data/KEYWORD_INVENTORY.csv data/UNDATED_RECOVERY_DOUBLE_STAR_REPORT.json batches/UNDATED_RECOVERY_DOUBLE_STAR.md batches/undated-recovery-double-star/ tables/
            if git diff --cached --quiet; then
              echo "No changes required"
              exit 0
            fi
            git commit -m "Recover all previously undated terms with labeled ★★ guesses and source-year ranges"
            if git push origin HEAD:main; then
              echo "Published full double-star recovery"
              exit 0
            fi
            sleep 3
          done
          echo "Could not safely publish because repository changed repeatedly"
          exit 1
