name: Audit Batch 008 against original scholarly sources

on:
  push:
    paths:
      - ".github/workflows/audit_dates_008_sources.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-keywords-audit-008
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply original research corrections and remove cross-domain false dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit_dates_008_original_sources.py
            python scripts/build_keyword_tables.py
            python scripts/sync_readme.py
            python - <<'PY'
          import csv,json
          from pathlib import Path
          report=json.loads(Path("data/DATE_RESEARCH_008_REPORT.json").read_text())
          assert report["examined"]==2000
          assert report["manual_source_corrections"]==9
          assert report["cross_domain_sources_rejected"]==2
          assert sum(report[k] for k in ("documented_source_dates","estimated_star_dates","unresolved"))==2000
          with Path("data/KEYWORD_INVENTORY.csv").open(encoding="utf-8",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20100 and len(set(x["id"] for x in rows))==20100
          by_id={r["id"]:r for r in rows}
          expected={"AIH-08508":"2021","AIH-08509":"2023","AIH-08510":"1990",
                    "AIH-08513":"2022","AIH-08515":"2012","AIH-09002":"2023",
                    "AIH-09015":"1951","AIH-09502":"1980","AIH-10008":"2019"}
          for uid,year in expected.items():
              record=by_id[uid]
              assert record["historical_evidence_date"]==year
              assert record["historical_evidence_url"].startswith("https://")
              assert not record["first_use_date"]
          for uid in ("AIH-08516","AIH-10002"):
              assert not by_id[uid]["historical_evidence_date"]
              assert by_id[uid]["date_status"]=="unresolved"
          for i in range(1,5):
              path=Path(f"batches/date-research-008/page-{i:02d}.md")
              assert sum(line.startswith("| AIH-") for line in path.read_text().splitlines())==500
          for path in ("batches/DATE_RESEARCH_004_RECOVERY_FIRST_1000.md",
                       "batches/DATE_RESEARCH_005_NEXT_2000.md",
                       "batches/DATE_RESEARCH_006_NEXT_2000.md",
                       "batches/DATE_RESEARCH_007_NEXT_2000.md"):
              assert Path(path).exists()
          assert by_id["AIH-02503"]["historical_evidence_date"]=="2016"
          assert by_id["AIH-06007"]["historical_evidence_date"]=="2023"
          print("Verified source audit, complete tables, preserved IDs and earlier research.")
          PY
            git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_008_REPORT.json batches/DATE_RESEARCH_008_NEXT_2000.md batches/date-research-008/ tables/
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "Audit batch 008: nine early sources and remove two unrelated publication dates"
            if git push origin HEAD:main; then
              echo "Audited Batch 008 published"
              exit 0
            fi
            sleep 2
          done
          exit 1
