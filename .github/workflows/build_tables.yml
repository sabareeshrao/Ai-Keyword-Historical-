name: Publish complete keyword tables

on:
  push:
    paths:
      - ".github/workflows/build_tables.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate 20 complete 500-row Markdown keyword tables
        run: python scripts/build_keyword_tables.py
      - name: Commit complete tables and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tables/ batches/INVENTORY_001_5000.md batches/INVENTORY_002_5000.md
          if git diff --cached --quiet; then
            echo "Tables already current"
            exit 0
          fi
          git commit -m "Publish all 10000 keywords as 20 complete browsable GitHub tables"
          git push origin HEAD:main
