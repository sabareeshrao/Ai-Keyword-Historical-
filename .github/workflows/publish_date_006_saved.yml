name: Publish validated batch 006 from saved research

on:
  push:
    paths:
      - ".github/workflows/publish_date_006_saved.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-validated-date-006
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use latest repository state and preserve concurrent work
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/download-artifact@v4
        with:
          run-id: 42281478274
          github-token: ${{ github.token }}
          pattern: date-006-segment-*
          merge-multiple: true
          path: data/date_staging
      - name: Merge 2000 source searches into batch 006
        run: python scripts/merge_date_research_006_2000.py
      - name: Recreate source-linked master tables
        run: python scripts/build_keyword_tables.py
      - name: Synchronize README without erasing recovery
        run: python scripts/sync_readme.py
      - name: Validate all researched dates and previous reports
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=json.loads(Path("data/DATE_RESEARCH_006_REPORT.json").read_text())
          assert d["examined"]==2000 and d["inventory_total"]==20100
          assert d["documented_source_dates"]+d["estimated_star_dates"]+d["unresolved"]==2000
          assert d["existing_first_4500_unchanged"] and d["stable_ids_preserved"]
          with open("data/KEYWORD_INVENTORY.csv",newline="",encoding="utf-8") as f:rows=list(csv.DictReader(f))
          assert len(rows)==20100
          assert len({x["id"] for x in rows})==20100
          assert sum(4501<=int(x["id"].split("-")[-1])<=6500 for x in rows)==2000
          assert Path("batches/DATE_RESEARCH_004_RECOVERY_FIRST_1000.md").exists()
          assert Path("batches/DATE_RESEARCH_005_NEXT_2000.md").exists()
          gail=next(r for r in rows if r["id"]=="AIH-02503")
          assert gail["historical_evidence_date"]=="2016"
          for i in range(1,5):
              lines=Path(f"batches/date-research-006/page-{i:02d}.md").read_text().splitlines()
              assert sum(x.startswith("| AIH-") for x in lines)==500
          for row in rows:
              if 4501<=int(row["id"].split("-")[-1])<=6500:
                  assert not row.get("first_use_date")
                  if row.get("date_status")=="estimated_star":
                      assert row["display_date"].endswith(" ★") and row.get("estimated_source_url") and row.get("estimated_reason")
          print("Validation successful, retained recovery 004, batches 005 and 006.")
          PY
      - name: Retry non-forced GitHub push if main advances concurrently
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_006_REPORT.json batches/DATE_RESEARCH_006_NEXT_2000.md batches/date-research-006/ tables/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Research 2000 additional keyword dates in batch 006; retain ★ and prior evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then
              echo "Published after attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "Remote changed repeatedly; no force push was attempted"
          exit 1
