name: Correct GAIL historical source and rebuild tables

on:
  push:
    paths:
      - ".github/workflows/correct_gail_2016.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replace unrelated cancer surname citation with original GAIL research
        run: python scripts/correct_gail_2016.py
      - name: Regenerate all 40 browsable master tables
        run: python scripts/build_keyword_tables.py
      - name: Retain recovery and batch README links
        run: python scripts/sync_readme.py
      - name: Check GAIL and recovery preservation
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("data/KEYWORD_INVENTORY.csv").open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20100
          r=next(r for r in rows if r["id"]=="AIH-02503")
          assert r["historical_evidence_date"]=="2016"
          assert r["historical_evidence_url"]=="https://arxiv.org/abs/1606.03476"
          assert Path("batches/DATE_RESEARCH_004_RECOVERY_FIRST_1000.md").exists()
          assert "Recovery 004" in Path("README.md").read_text()
          print("Verified GAIL corrected, recovery preserved, full master record count.")
          PY
      - name: Commit audited correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_005_REPORT.json batches/DATE_RESEARCH_005_NEXT_2000.md tables/
          git diff --cached --quiet && exit 0
          git commit -m "Fix GAIL cross-domain title collision using 2016 Ho and Ermon original paper"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
