name: Correct Reflexion AI framework date (2023)

on:
  push:
    paths:
      - ".github/workflows/correct_reflexion_2023.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Incorporate latest concurrent research safely
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Fix unrelated historical word-match for the named 2023 AI framework
        run: python scripts/correct_reflexion_2023.py
      - name: Regenerate complete master tables
        run: python scripts/build_keyword_tables.py
      - name: Verify preservation and corrected source
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          with Path("data/KEYWORD_INVENTORY.csv").open(encoding="utf-8",newline="") as f:
              all_rows=list(csv.DictReader(f))
          assert len(all_rows)==20100
          r=next(x for x in all_rows if x["id"]=="AIH-06007")
          assert r["historical_evidence_date"]=="2023"
          assert r["historical_evidence_url"]=="https://arxiv.org/abs/2303.11366"
          assert not r["first_use_date"]
          assert "AIH-06007 | Reflexion | Agentic AI | 2023" in Path("batches/date-research-006/page-04.md").read_text()
          report=json.loads(Path("data/DATE_RESEARCH_006_REPORT.json").read_text())
          assert report["examined"]==2000 and report["manual_semantic_source_corrections"]>=1
          assert Path("batches/DATE_RESEARCH_004_RECOVERY_FIRST_1000.md").exists()
          assert Path("batches/DATE_RESEARCH_005_NEXT_2000.md").exists()
          print("Verified primary source, full table, all IDs and preserved recovery.")
          PY
      - name: Commit corrected date and page without force pushing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_006_REPORT.json batches/DATE_RESEARCH_006_NEXT_2000.md batches/date-research-006/page-04.md tables/
          git diff --cached --quiet && exit 0
          git commit -m "Correct Reflexion agent framework to its 2023 original research source"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || exit 1
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
