name: Research 2000 historical term dates with starred estimates

on:
  push:
    paths:
      - ".github/workflows/research_dates_004_2000.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: historical-date-research-004
  cancel-in-progress: false

jobs:
  segments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start: [2501, 3501]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research a separate 1000-keyword segment and find source-backed ★ estimates
        run: python scripts/date_research_2000_segment.py --start ${{ matrix.start }}
      - uses: actions/upload-artifact@v4
        with:
          name: historical-dates-segment-${{ matrix.start }}
          path: data/segment_date_2026_*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: segments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: historical-dates-segment-*
          merge-multiple: true
          path: data/date_staging
      - name: Merge source dates and ★ estimates; validate ID integrity
        run: python scripts/merge_date_research_2000.py
      - name: Regenerate all complete keyword tables
        run: python scripts/build_keyword_tables.py
      - name: Update full project README
        run: python scripts/sync_readme.py
      - name: Validate 2000 research records and four full tables
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          info=json.loads(Path('data/DATE_RESEARCH_004_REPORT.json').read_text())
          assert info['examined']==2000 and info['inventory_total']==20100
          assert info['documented_source_dates']+info['estimated_star_dates']+info['unresolved']==2000
          with open('data/KEYWORD_INVENTORY.csv',newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==20100 and len({r['id'] for r in rows})==20100
          group=[r for r in rows if 2501<=int(r['id'].split('-')[-1])<=4500]
          assert len(group)==2000
          for r in group:
              if r['date_status']=='estimated_star':
                  assert r['display_date'].endswith(' ★') and r['estimated_source_url'] and r['estimated_reason']
              assert not r['first_use_date']
          for i in range(1,5):
              page=Path(f'batches/date-research-004/page-{i:02d}.md')
              assert sum(line.startswith('| AIH-') for line in page.read_text().splitlines())==500
          print('Valid: 2000 rows, 4 full tables, star estimates sourced, all IDs unchanged.')
          PY
      - name: Commit audited historical data, reports, and all readable tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_004_REPORT.json batches/DATE_RESEARCH_004_NEXT_2000.md batches/date-research-004/ tables/
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git commit -m "Research 2000 keyword dates; publish documented sources and ★ estimates in four tables"
          git push origin HEAD:main
