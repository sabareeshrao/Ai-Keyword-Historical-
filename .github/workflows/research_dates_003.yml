name: Research and publish dates for IDs 1501-2500

on:
  push:
    paths:
      - ".github/workflows/research_dates_003.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-dates-003
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source scholarly dates for exactly 1000 stable IDs
        run: python scripts/research_dates_next_1000_batch003.py
      - name: Rebuild full keyword table pages with links to dated evidence
        run: python scripts/build_keyword_tables.py
      - name: Update README
        run: python scripts/sync_readme.py
      - name: Check publication size and evidence status
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('data/DATE_RESEARCH_003_REPORT.json')
          r=json.loads(p.read_text())
          assert r['examined']==1000 and r['inventory_size']==20100
          assert r['dated_source_records'] + r['unresolved']==1000
          for page in ['batches/date-research-003/page-01.md','batches/date-research-003/page-02.md']:
              assert sum(line.startswith('| AIH-') for line in Path(page).read_text().splitlines()) == 500
          with Path('data/KEYWORD_INVENTORY.csv').open(newline='') as f: data=list(csv.DictReader(f))
          assert len(data)==20100
          assert all(not x.get('first_use_date') for x in data if 1501<=int(x['id'].split('-')[-1])<=2500)
          print('Verified 1000 rows and',r['dated_source_records'],'linked scholarly dates.')
          PY
      - name: Commit date evidence and all complete tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/KEYWORD_INVENTORY.csv data/DATE_RESEARCH_003_REPORT.json batches/DATE_RESEARCH_003_NEXT_1000.md batches/date-research-003/ tables/ README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Date research batch 003: document sources for AIH-01501 through AIH-02500"
          git push origin HEAD:main
